<!doctype html><html><body style="margin:0;background:#000"><canvas id="c"></canvas><script>
const FRAG = `
precision highp float;
varying vec2 vUv;
uniform float uSortie; // 0 = couleur, 1 = relief + rugosité
uniform vec2 uEchelle;
uniform float uExpo;

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float bruit(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 6; i++){ v += a * bruit(p); p = p * 2.02 + 13.7; a *= 0.5; } return v; }

void main(){
  vec2 uv = vUv * uEchelle;           // unités scène : x le long du fil
  float largeurLame = 40.0;   // plateau d'un seul tenant (pas de lames)
  float ly = uv.y / largeurLame;
  float id = floor(ly);
  float fy = fract(ly);
  float decal = hash(vec2(id, 3.1)) * 40.0;
  vec2 p = vec2(uv.x * 0.9 + decal, fy * largeurLame);

  // fil du bois : cernes étirés, déformés par un bruit lent
  float deformation = fbm(vec2(p.x * 0.35, p.y * 2.2 + id * 5.0));
  float cernes = p.y * 15.0 + deformation * 9.0 + fbm(vec2(p.x * 0.08, id)) * 14.0;
  float veine = pow(abs(sin(cernes)), 0.45);
  float fibre = bruit(vec2(p.x * 3.0, p.y * 380.0 + deformation * 30.0));
  float pores = smoothstep(0.72, 0.95, bruit(vec2(p.x * 22.0, p.y * 900.0)));
  float nuance = fbm(vec2(p.x * 0.18 + id * 7.0, p.y * 1.4));

  // noyer foncé (valeurs linéaires)
  vec3 fonce = vec3(0.022, 0.011, 0.0055);
  vec3 moyen = vec3(0.078, 0.040, 0.019);
  vec3 clair = vec3(0.150, 0.082, 0.040);
  vec3 c = mix(fonce, moyen, veine);
  c = mix(c, clair, smoothstep(0.35, 0.95, nuance) * 0.55);
  c *= 0.86 + 0.22 * fibre;
  c *= 1.0 - pores * 0.25;
  c *= 0.9 + hash(vec2(id, 9.0)) * 0.22;          // chaque lame a sa teinte

  // le plateau se perd dans la pénombre avant d'atteindre ses bords
  float bord = min(min(uv.x, uEchelle.x - uv.x), min(uv.y, uEchelle.y - uv.y));
  c *= mix(0.55, 1.0, smoothstep(0.0, 1.1, bord));
  vec2 l = vUv - vec2(0.42, 0.38); c *= 1.15 + 0.55 * exp(-dot(l * vec2(1.0, 2.2), l * vec2(1.0, 2.2)) * 3.2);
  c *= uExpo;
  float reflet = exp(-pow((vUv.x * 0.9 - vUv.y * 0.55 - 0.18) * 3.4, 2.0)); c += vec3(0.05, 0.035, 0.022) * reflet * 0.9;

  // joints entre lames
  float joint = smoothstep(0.0, 0.012, fy) * smoothstep(0.0, 0.012, 1.0 - fy);
  c *= mix(0.35, 1.0, joint);

  if (uSortie < 0.5) {
    gl_FragColor = vec4(pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2)), 1.0);
  } else {
    float relief = 0.55 + 0.3 * veine + 0.15 * fibre - pores * 0.35;
    relief *= mix(0.0, 1.0, joint);
    float rugosite = 0.58 + 0.18 * (1.0 - veine) + pores * 0.2;
    gl_FragColor = vec4(relief, rugosite, 0.0, 1.0);
  }
}`;
const VERT = `attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
window.cuire = (w, h, ex, ey, expo) => { const c = document.getElementById('c'); c.width = w; c.height = h; const g = c.getContext('webgl', { preserveDrawingBuffer: true });
  const sh = (t, s) => { const o = g.createShader(t); g.shaderSource(o, s); g.compileShader(o); if (!g.getShaderParameter(o, g.COMPILE_STATUS)) throw g.getShaderInfoLog(o); return o; };
  const pr = g.createProgram(); g.attachShader(pr, sh(g.VERTEX_SHADER, VERT)); g.attachShader(pr, sh(g.FRAGMENT_SHADER, FRAG)); g.linkProgram(pr); g.useProgram(pr);
  const b = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER, b); g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(pr, 'p'); g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
  g.uniform1f(g.getUniformLocation(pr, 'uSortie'), 0); g.uniform2f(g.getUniformLocation(pr, 'uEchelle'), ex, ey); g.uniform1f(g.getUniformLocation(pr, 'uExpo'), expo);
  g.viewport(0, 0, w, h); g.drawArrays(g.TRIANGLE_STRIP, 0, 4); return c.toDataURL('image/png'); };
</script></body></html>
