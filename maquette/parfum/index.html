<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/parfum/">
<title>Flacon Librery 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece6dd; --ink: #2b231d; --muted: #7a6d62; --line: rgba(43,35,29,.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hanken Grotesk", system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  header { position: fixed; top: 24px; left: 0; right: 0; text-align: center; pointer-events: none; }
  header small { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  header h1 { margin: 6px 0 0; font: 400 clamp(28px, 5vw, 44px)/1.1 "Libre Caslon Display", serif; }
  nav { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: calc(100% - 32px); }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    cursor: pointer; padding: 0; outline-offset: 3px; transition: transform .2s; }
  .swatch[aria-pressed="true"] { outline: 1px solid var(--ink); transform: scale(1.08); }
  .toggle { margin-left: 8px; height: 30px; padding: 0 14px; border-radius: 15px; background: transparent;
    border: 1px solid var(--ink); color: var(--ink); font: 500 11px/1 "Hanken Grotesk", sans-serif;
    letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  #version { margin-top: 6px; font-size: 10.5px; line-height: 1.5; color: var(--muted); letter-spacing: .04em; }
  #tour { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  #tour.actif { display: flex; }
  #tour.glisse { cursor: grabbing; }
  #tour img { height: min(78vh, 125vw); width: auto; max-width: 100%; object-fit: contain;
    pointer-events: none; margin-top: 3vh;
    /* Fondu des bords : le plateau du rendu se perd dans le fond de la page. */
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 48%, #000 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at 50% 48%, #000 55%, transparent 100%); }
  body { transition: background-color .6s; }
  #tour-aide { position: fixed; left: 0; right: 0; bottom: 78px; text-align: center; font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted); pointer-events: none;
    transition: opacity .6s; }
  .toggle.secondaire { border-color: var(--line); color: var(--muted); }
  body.capture header, body.capture nav, body.capture #version { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 12px;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 600px) { #tour-aide { bottom: 150px; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="tour" aria-label="Flacon en rotation, glisser pour tourner"><img id="tour-img" alt=""></div>
<div id="tour-aide" hidden>Glisser pour tourner</div>
<div id="loading">Chargement…</div>
<header><small>Extrait de parfum · 100 ml</small><h1 id="nom">&nbsp;</h1><div id="version"></div></header>
<nav id="nav"></nav>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// « PBR Neutral » (Khronos) : restitue les couleurs produit sans les délaver.
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
// Le verre réfracte ce qui est rendu derrière lui : il faut un vrai fond.
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
// Studio virtuel : pièce sombre et chaude, grandes boîtes à lumière. Ce sont
// elles qui dessinent les longs reflets sur les arêtes du verre et le contraste
// de l'or poli, comme sur les photos produit.
function studio() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 16),
    new THREE.MeshBasicMaterial({ color: 0x7d736a, side: THREE.BackSide }));
  env.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10),
    new THREE.MeshBasicMaterial({ color: 0xd9d0c4 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.6; env.add(floor);
  const box = (w, h, x, y, z, k, tint = 0xfff6ec) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0.3, 0); env.add(m);
  };
  box(0.5, 3.2, -2.2, 0.8, 1.2, 9);    // bande verticale gauche
  box(0.4, 3.2, 2.3, 0.8, 0.6, 7);     // bande verticale droite
  box(2.6, 1.6, 0, 3.2, 0.4, 3);       // plafonnier
  box(3.0, 1.4, 0, 0.6, -2.6, 2, 0xffe9d2);   // fond chaud, éclaire le jus par derrière
  box(1.2, 0.5, -1.2, 1.8, 2.4, 3);    // petite face avant, points brillants
  box(2.4, 1.2, 0.3, 0.5, 3.0, 1.6, 0xfff1e4);   // grand réflecteur côté photographe
  // Drapeaux noirs : les bandes sombres qui dessinent les arêtes du verre et de l'or.
  box(1.0, 3.4, -1.3, 0.8, 2.3, 0.02, 0x000000);
  box(1.0, 3.4, 1.5, 0.8, 2.1, 0.02, 0x000000);
  box(1.2, 3.4, 2.7, 0.8, -1.2, 0.02, 0x000000);
  box(1.2, 3.4, -2.8, 0.8, -1.0, 0.02, 0x000000);
  return env;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(studio(), 0.01).texture;
scene.environmentIntensity = 1.0;

const camera = new THREE.PerspectiveCamera(26, 1, 0.01, 5);
camera.position.set(0.16, 0.10, 0.36);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.062, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 0.18;
controls.autoRotate = !new URLSearchParams(location.search).has("fixe"); controls.autoRotateSpeed = 0.8;
controls.addEventListener("start", () => (controls.autoRotate = false));

// Ombre douce au sol.
const shadowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, "rgba(43,35,29,.35)"); grd.addColorStop(1, "rgba(43,35,29,0)");
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 0.08),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.0005; scene.add(shadow);

// Caustique : la lumière de la boîte à lumière gauche traverse le jus et
// projette au sol, derrière le flacon, une tache colorée plus vive au cœur
// (comme sur les photos de campagne). Additive : elle éclaircit le sol.
const causticTex = (() => {
  const c = document.createElement("canvas"); c.width = 128; c.height = 256;
  const g = c.getContext("2d");
  const halo = g.createRadialGradient(64, 150, 4, 64, 150, 64);
  halo.addColorStop(0, "rgba(255,255,255,.55)"); halo.addColorStop(1, "rgba(255,255,255,0)");
  g.save(); g.scale(1, 1.8); g.translate(0, -66); g.fillStyle = halo; g.fillRect(0, 0, 128, 256); g.restore();
  const coeur = g.createRadialGradient(64, 170, 1, 64, 170, 18);
  coeur.addColorStop(0, "rgba(255,255,255,1)"); coeur.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = coeur; g.fillRect(0, 0, 128, 256);
  for (let k = 0; k < 5; k++) {           // filets lumineux des arêtes du verre
    g.strokeStyle = `rgba(255,255,255,${0.18 + 0.1 * (k % 2)})`; g.lineWidth = 2;
    g.beginPath(); g.moveTo(40 + k * 12, 60); g.quadraticCurveTo(44 + k * 10, 150, 52 + k * 6, 230); g.stroke();
  }
  return new THREE.CanvasTexture(c);
})();
const caustic = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.1),
  new THREE.MeshBasicMaterial({ map: causticTex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, toneMapped: false }));
caustic.rotation.set(-Math.PI / 2, 0, 0.55);
caustic.position.set(0.028, 0.0007, -0.05);
scene.add(caustic);

// Le suffixe ?v= évite qu'un ancien modèle reste en cache après une mise à jour.
const modele = await fetch("modele.json", { cache: "no-store" }).then((r) => r.json()).catch(() => ({}));
const v = encodeURIComponent(modele.date || Date.now());
// La vue 360° se charge en même temps que le modèle 3D, sans l'attendre.
const handleInitial = location.hash.slice(1) || "tonka-love";
// Vue photo 360° (images Cycles) désactivée : ces images ne suivent plus le
// modèle (typo des étiquettes, logo du capot). La page reste sur la 3D temps
// réel, qui charge toujours le dernier modèle. Passer à true pour la rétablir.
const AVEC_360 = false;
const premier360 = AVEC_360 ? charger360(handleInitial) : Promise.resolve(null);
const [gltf, parfums] = await Promise.all([
  new GLTFLoader().loadAsync(`flacon-100ml.glb?v=${v}`),
  fetch(`parfums.json?v=${v}`).then((r) => r.json()),
]);
if (modele.date) {
  const fmt = (d) => d.map((x) => String(x).replace(".", ",")).join(" × ");
  document.getElementById("version").innerHTML =
    `Modèle du ${modele.date}<br>Verre ${fmt(modele.verre)} mm · capot ${fmt(modele.capot)} mm<br>Hauteur ${String(modele.hauteur).replace(".", ",")} mm`;
}
const flacon = gltf.scene;
scene.add(flacon);
const parts = {};
flacon.traverse((o) => { if (o.isMesh) parts[o.name] = o; });

// Matières. Three.js ne montre pas un objet transmissif à travers un autre,
// sauf la face arrière des objets double face : le jus est donc transmissif
// et double face (sa paroi du fond entre dans l'image que le verre réfracte),
// le verre transmissif en simple face. Le tube plongeur est opaque, pour
// rester visible au travers du jus et du verre.
const glass = parts.Verre.material;
Object.assign(glass, { roughness: 0, metalness: 0, transmission: 1, ior: 1.5,
  thickness: 0.02, attenuationDistance: 0.1, specularIntensity: 1,
  dispersion: 0.35,          // irisations aux arêtes, comme un vrai verre épais
  side: THREE.FrontSide, envMapIntensity: 1 });
const juice = parts.Jus.material;
Object.assign(juice, { roughness: 0, metalness: 0, transmission: 1, ior: 1.36,
  thickness: 0.03, attenuationDistance: 0.042, side: THREE.DoubleSide, envMapIntensity: 0.6 });
const or = parts.Capot.material;
Object.assign(or, { metalness: 1, roughness: 0.08, envMapIntensity: 1.1 });
or.color.setRGB(0.95, 0.83, 0.70, THREE.SRGBColorSpace);   // or champagne, légèrement rosé
for (const n of ["Virole", "Col", "Poussoir"]) if (parts[n]) parts[n].material = or;
// Tube plongeur : opaque, sinon Three.js ne le dessine pas au travers du
// verre et du jus (les objets transparents sont exclus de la transmission).
const plastique = new THREE.MeshStandardMaterial({ color: 0xe9e3d8, roughness: 0.25, metalness: 0 });
for (const n of ["TubePlongeur", "Tige"]) if (parts[n]) parts[n].material = plastique;
const label = parts.Etiquette.material;
Object.assign(label, { transparent: true, depthWrite: false, alphaTest: 0.02,
  metalness: 0.35, roughness: 0.3, envMapIntensity: 1.2 });
label.color.setRGB(1.0, 0.95, 0.86, THREE.SRGBColorSpace);
label.emissive.setRGB(0.8, 0.74, 0.62);    // la dorure reste lisible sur un jus sombre
label.emissiveMap = null;
parts.Etiquette.renderOrder = 2;

const texLoader = new THREE.TextureLoader();

// Emblème gravé dans le dessus du capot : décalque aux traits nets, fond
// d'or bruni (comme sur le vrai flacon), posé à plat sur la face supérieure.
{
  const cap = parts.Capot;
  cap.geometry.computeBoundingBox();
  const bb = cap.geometry.boundingBox;
  const tex = texLoader.load(`emblem-gravure.png?v=${v}`);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const hauteur = 0.026, largeur = hauteur * 1844 / 2080;          // 26 mm de haut, comme dans Blender
  const grave = new THREE.MeshStandardMaterial({ map: tex, color: 0x3b271a, metalness: 0.5, roughness: 0.55,
    transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 });
  const embleme = new THREE.Mesh(new THREE.PlaneGeometry(largeur, hauteur), grave);
  embleme.name = "EmblemeCapot";
  embleme.rotation.x = -Math.PI / 2;
  embleme.position.set((bb.min.x + bb.max.x) / 2, bb.max.y + 0.00001, (bb.min.z + bb.max.z) / 2);
  cap.add(embleme);
}
const labels = {};
function labelTexture(handle) {
  if (!labels[handle]) {
    const t = texLoader.load(`labels/${handle}.png?v=${v}`);
    t.colorSpace = THREE.SRGBColorSpace;
    t.flipY = false;               // convention glTF
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    labels[handle] = t;
  }
  return labels[handle];
}

let select = function (handle) {
  const p = parfums[handle];
  document.getElementById("nom").textContent = p.nom;
  // Même un verre clair prend la couleur du jus dans ses parties épaisses
  // (socle, épaules) : il la renvoie par réflexions internes.
  const jus = new THREE.Color().setRGB(...p.jus, THREE.SRGBColorSpace);
  // Three.js applique une épaisseur unique à tout le verre : on force la
  // teinte pour que le socle massif ne paraisse pas dépoli. Les verres
  // teintés (Mango Wave, Palmeira…) sont plus denses que les verres clairs.
  const teinte = p.verre.some((c) => c < 0.95);
  glass.attenuationColor.setRGB(...p.verre, THREE.SRGBColorSpace).lerp(jus, teinte ? 0.2 : 0.5);
  glass.attenuationDistance = teinte ? 0.035 : 0.06;
  // Teinte de surface en plus : sur un fond clair, l'atténuation seule laisse
  // le socle presque blanc, alors qu'en vrai il renvoie la couleur du jus.
  // Verre teinté : sa couleur propre est saturée, proche du jus (socle
  // magenta de Palmeira, violet de Mango Wave…).
  if (teinte) glass.color.copy(jus).lerp(new THREE.Color().setRGB(...p.verre, THREE.SRGBColorSpace), 0.35)
    .lerp(new THREE.Color(1, 1, 1), 0.3);
  else glass.color.set(1, 1, 1).lerp(glass.attenuationColor, 0.4);
  // Le jus se colore dans sa masse (atténuation), pas en surface.
  juice.attenuationColor.copy(jus);
  // Tube plongeur : plastique translucide, il prend la couleur du jus et ne
  // se détache qu'à peine (un filet discret, comme sur les photos).
  plastique.color.copy(jus).lerp(new THREE.Color(1, 1, 1), 0.3);
  juice.attenuationDistance = teinte ? 0.07 : 0.042;   // le verre teinté assombrit déjà
  juice.color.set(1, 1, 1);
  // Caustique et ombre prennent la couleur du jus.
  caustic.material.color.copy(jus).multiply(jus).multiplyScalar(0.42);   // couleur saturée, lumière douce
  shadow.material.color.set(1, 1, 1).lerp(jus, 0.35);
  label.map = labelTexture(handle);
  label.emissiveMap = label.map;
  label.needsUpdate = true;
  for (const b of nav.querySelectorAll(".swatch"))
    b.setAttribute("aria-pressed", b.dataset.handle === handle);
  history.replaceState(null, "", `#${handle}`);
};

// Nuancier + capot.
const nav = document.getElementById("nav");
for (const [handle, p] of Object.entries(parfums)) {
  const b = document.createElement("button");
  b.className = "swatch"; b.dataset.handle = handle; b.title = p.nom;
  b.setAttribute("aria-label", p.nom);
  const [r, g, bl] = p.jus.map((v) => Math.round(v * 255));
  b.style.background = `rgb(${r},${g},${bl})`;
  b.onclick = () => select(handle);
  nav.append(b);
}
const capBtn = document.createElement("button");
capBtn.className = "toggle"; capBtn.textContent = "Ôter le capot";
nav.append(capBtn);
let capOpen = false, capT = 0;
capBtn.onclick = () => {
  capOpen = !capOpen;
  capBtn.textContent = capOpen ? "Remettre le capot" : "Ôter le capot";
};

// Pour le débogage et les comparaisons photo | rendu (3d/scripts/comparer_web.mjs).
window.flacon = { THREE, scene, renderer, parts, camera, controls, select,
  // Caméra ajustée sur une photo (voir ajuster.py) : lacet, tangage (°),
  // distance (mm), focale et centre optique (px) pour une image w × h.
  photo([yaw, pitch, dist, f, cx, cy], w, h) {
    const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
    const t = [0, 65, 0];   // cible, en mm, repère Three.js (y vers le haut)
    camera.position.set(t[0] + dist * Math.sin(y) * Math.cos(p), t[1] + dist * Math.sin(p),
      t[2] + dist * Math.cos(y) * Math.cos(p)).multiplyScalar(0.001);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0.065, 0);
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(h / 2 / f));
    camera.aspect = w / h;
    camera.setViewOffset(w, h, w / 2 - cx, h / 2 - cy, w, h);
    camera.updateProjectionMatrix();
    controls.enabled = false; controls.autoRotate = false; photoMode = true;
    document.body.classList.add("capture");
  },
};
let photoMode = false;
select(location.hash.slice(1) in parfums ? location.hash.slice(1) : "tonka-love");
document.getElementById("loading").remove();

// ---- Vue 360° photoréaliste : images calculées dans Blender Cycles
// (3d/scripts/rendu.py --tour), une tous les 10°. Si un parfum n'en a
// pas encore, la page reste sur la 3D temps réel.
const tour = document.getElementById("tour");
const tourImg = document.getElementById("tour-img");
const aide = document.getElementById("tour-aide");
const vue = { mode: "3d", handle: null, images: [], i: 0, pos: 0, auto: true };
const modeBtn = document.createElement("button");
modeBtn.className = "toggle secondaire";
nav.append(modeBtn);

async function charger360(handle) {
  // Jusqu'à trois essais : au chargement, la requête peut échouer pendant
  // que le modèle 3D et les polices se téléchargent.
  let info = null;
  for (let essai = 0; essai < 3 && !info; essai++) {
    const r = await fetch(`360/${handle}/info.json?v=${v}`,
      { cache: "no-store", signal: AbortSignal.timeout(8000) }).catch(() => null);
    if (r && r.status === 404) return null;          // pas de 360 pour ce parfum
    info = r && r.ok ? await r.json().catch(() => null) : null;
    if (!info) await new Promise((ok) => setTimeout(ok, 400 * (essai + 1)));
  }
  if (!info) return null;
  const images = Array.from({ length: info.vues }, (_, k) => {
    const im = new Image();
    im.decoding = "async";
    im.src = `360/${handle}/${String(k).padStart(2, "0")}.webp?v=${v}`;
    return im;
  });
  // Première vue décodée avant l'affichage (4 s au plus).
  await Promise.race([images[0].decode().catch(() => {}), new Promise((ok) => setTimeout(ok, 4000))]);
  return images;
}

// La page prend la couleur du plateau (coin haut de la première image).
function accorderFond(im) {
  try {
    const W = 64, H = 80;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d"); g.drawImage(im, 0, 0, W, H);
    // Moyenne sur le milieu des bords gauche et droit (hauteur du flacon) :
    // la couleur que le fondu du masque rejoint.
    let r = 0, gg = 0, b = 0, n = 0;
    for (const x of [1, 2, W - 3, W - 2]) for (let y = 20; y < 60; y += 2) {
      const d = g.getImageData(x, y, 1, 1).data; r += d[0]; gg += d[1]; b += d[2]; n++;
    }
    document.body.style.backgroundColor = `rgb(${r / n | 0},${gg / n | 0},${b / n | 0})`;
  } catch { /* image pas encore décodée : on garde le fond par défaut */ }
}

function afficher(pos) {
  const n = vue.images.length;
  vue.pos = ((pos % n) + n) % n;              // position fractionnaire (rotation lente)
  vue.i = Math.round(vue.pos) % n;
  const im = vue.images[vue.i];
  if (im.complete && im.naturalWidth) tourImg.src = im.src;
}

async function mode360(handle, deja) {
  const images = await (deja || charger360(handle));
  if (!images) return false;
  vue.images = images; vue.handle = handle;
  accorderFond(images[0]);
  afficher(vue.pos);
  return true;
}

function appliquerMode(m) {
  vue.mode = m;
  const photo = m === "360";
  tour.classList.toggle("actif", photo);
  canvas.style.visibility = photo ? "hidden" : "visible";
  aide.hidden = !photo;
  capBtn.hidden = photo;
  if (!photo) document.body.style.backgroundColor = "";
  modeBtn.textContent = photo ? "3D temps réel" : "Vue photo 360°";
}

modeBtn.onclick = async () => {
  if (vue.mode === "360") appliquerMode("3d");
  else if (await mode360(currentHandle())) appliquerMode("360");
};
function currentHandle() { return location.hash.slice(1) in parfums ? location.hash.slice(1) : "tonka-love"; }

// Glisser pour tourner (souris et doigt), avec un peu d'inertie.
let glisse = null, vitesse = 0;
tour.addEventListener("pointerdown", (e) => {
  glisse = { x: e.clientX, i: vue.pos, t: performance.now() };
  vue.auto = false; vitesse = 0;
  tour.setPointerCapture(e.pointerId); tour.classList.add("glisse");
  aide.style.opacity = 0;
});
tour.addEventListener("pointermove", (e) => {
  if (!glisse) return;
  const pas = tour.clientWidth / (vue.images.length * 1.2);   // ≈ un tour sur la largeur
  const i = glisse.i - (e.clientX - glisse.x) / pas;
  const now = performance.now();
  vitesse = (i - vue.pos) / Math.max(1, now - glisse.t) * 16;
  glisse.t = now;
  afficher(i);
});
const lacher = () => { glisse = null; tour.classList.remove("glisse"); };
tour.addEventListener("pointerup", lacher);
tour.addEventListener("pointercancel", lacher);

// Au changement de parfum : on reste en 360° si ce parfum a ses images.
const selectOrig = select;
select = async (handle) => {
  selectOrig(handle);
  if (vue.mode === "360" && !(await mode360(handle))) appliquerMode("3d");
  modeBtn.hidden = !AVEC_360 || !(await fetch(`360/${handle}/info.json?v=${v}`, { cache: "no-store" }).then((r) => r.ok).catch(() => false));
};
for (const b of nav.querySelectorAll(".swatch")) b.onclick = () => select(b.dataset.handle);

// Au chargement : 360° par défaut si disponible (sauf ?fixe, gardé pour les captures 3D).
appliquerMode("3d");
const deja = currentHandle() === handleInitial ? premier360 : null;
if (!AVEC_360) modeBtn.hidden = true;
else if (!new URLSearchParams(location.search).has("fixe") && await mode360(currentHandle(), deja)) appliquerMode("360");
else modeBtn.hidden = !(await (deja || charger360(currentHandle())));

const capHome = parts.Capot.position.clone();
const CAP_BASE = new THREE.Box3().setFromObject(parts.Capot).min.y;   // hauteur du bas du capot
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  if (photoMode) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  // Recule la caméra pour cadrer le flacon (22 cm de haut, 15 de large),
  // titre et nuancier compris, quel que soit le format d'écran.
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(0.11 / t, 0.075 / (t * camera.aspect));
  camera.position.sub(controls.target).setLength(dist).add(controls.target);
  controls.maxDistance = dist * 1.6;
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  capT += ((capOpen ? 1 : 0) - capT) * Math.min(1, dt * 5);
  const e = capT * capT * (3 - 2 * capT);
  // Le capot se soulève puis se pose sur la table, à droite du flacon.
  parts.Capot.position.set(capHome.x + e * 0.068,
    capHome.y - e * CAP_BASE + Math.sin(Math.PI * e) * 0.035, capHome.z + e * 0.01);
  if (vue.mode === "360") {
    if (!glisse) {
      if (vue.auto) afficher(vue.pos + dt * 4);               // rotation lente au repos
      else if (Math.abs(vitesse) > 0.01) { afficher(vue.pos + vitesse); vitesse *= 0.92; }
    }
    return;                                                    // la 3D n'est pas dessinée
  }
  if (!photoMode) controls.update();
  renderer.render(scene, camera);
});
</script>
