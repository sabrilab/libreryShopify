<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La Carte — Points de vente LIBRERY</title>
<meta name="description" content="LIBRERY — la bibliothèque olfactive, où chaque fragrance se fait récit et chaque note, un souvenir. Extraits de parfum, Paris.">
<link rel="icon" type="image/png" href="/assets/img/v2/emblem-brun.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="carte" class="">
<div id="site-header"></div>
<main>
<section class="page-hero" style="padding-bottom:40px">
  <div class="wrap">
    <span class="runhead"><b>La Carte</b></span>
    <h1 class="display">Nos points de vente</h1>
    <p class="lead">Quelques adresses où nos récits prennent vie.</p>
  </div>
</section>
<section class="stores">
  <div class="stores__side">
    <div class="stores__search">
      <input id="stores-q" type="search" placeholder="Une ville, un pays, une adresse…" aria-label="Rechercher une adresse">
      <div class="pills" id="stores-pills"></div>
      <div class="filters__count" id="stores-count" style="margin-top:14px"></div>
    </div>
    <div class="stores__list" id="stores-list"></div>
  </div>
  <div class="stores__map"><div id="map" aria-label="Carte des points de vente"></div></div>
</section>
</main>
<div id="site-footer"></div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/assets/js/logo.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
