<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La Bibliothèque — LIBRERY</title>
<meta name="description" content="LIBRERY — la bibliothèque olfactive, où chaque fragrance se fait récit et chaque note, un souvenir. Extraits de parfum, Paris.">
<link rel="icon" type="image/png" href="/assets/img/v2/emblem-brun.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Marcellus&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="bibliotheque" class="">
<div id="site-header"></div>
<main>
<section class="page-hero">
  <div class="wrap">
    <span class="runhead"><b>Fragrances</b> · Extraits de parfum 25 %</span>
    <h1 class="display">La Bibliothèque</h1>
    <p class="lead">Chaque collection est un livre. Chaque fragrance, un chapitre. Chaque sillage, une histoire.</p>
  </div>
</section>
<section class="section--tight" style="padding-top:0">
  <div class="wrap">
    <div class="filters">
      <div class="pills" id="lib-pills">
        <button class="pill is-active" data-f="all">Tout</button>
        <button class="pill" data-f="skin-obsession">Skin Obsession</button>
        <button class="pill" data-f="summer-vibes">Summer Vibes</button>
        <button class="pill" data-f="coffrets">Coffrets</button>
      </div>
      <div style="display:flex;gap:26px;align-items:center">
        <span class="filters__count" id="lib-count"></span>
        <select id="lib-sort" aria-label="Trier">
          <option value="default">Par chapitre</option>
          <option value="az">Nom A → Z</option>
          <option value="asc">Prix croissant</option>
          <option value="desc">Prix décroissant</option>
        </select>
      </div>
    </div>
    <div id="library"></div>
  </div>
</section>
<section class="section on-brun">
  <div class="wrap s-diptych">
    <div class="s-diptych__media"><div class="media unveil" style="aspect-ratio:3/2"><img src="/assets/img/v2/camp-coffrets-m.webp" srcset="/assets/img/v2/camp-coffrets-m.webp 900w, /assets/img/v2/camp-coffrets.webp 1800w" sizes="(max-width: 900px) 100vw, 55vw" alt="Coffrets LIBRERY" loading="lazy" decoding="async"></div></div>
    <div class="s-diptych__txt reveal">
      <span class="runhead"><b>Chapitre à venir</b></span>
      <h2 class="h1 italic">Les Bougies</h2>
      <p class="lead">Les récits LIBRERY s’apprêtent à quitter la peau pour habiter l’espace.</p>
      <a class="btn btn--or" href="/collection?c=bougies">Être prévenu</a>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
